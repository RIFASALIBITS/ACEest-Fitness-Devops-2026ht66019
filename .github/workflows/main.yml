name: ACEest Fitness CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Code Quality Check
        run: flake8 app.py tests/
      - name: Execute Pytest Suite
        run: pytest -v

  docker-build:
    name: Container Assembly & Testing
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Test Inside Docker
        run: |
          docker build --target test -t aceest-fitness:test .
          docker run --rm aceest-fitness:test
      - name: Build Final Production Image
        run: docker build --target final -t aceest-fitness:latest .
